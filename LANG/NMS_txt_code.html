<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMS // TEXT CODES — Guide des balises No Man's Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d10;
    --panel:#12161b;
    --panel-2:#171c22;
    --line:#232a32;
    --text:#d8dde2;
    --text-dim:#8b96a1;
    --cyan:#46FFFF;
    --orange:#FFBC25;
    --green:#8BF667;
    --teal-green:#3DDC97;
    --red:#FF4825;
    --yellow:#F2EDC4;
    --syn-orange:#FF8A00;
    --grey:#E8E8E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(70,255,255,0.06), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(255,188,37,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{ font-family:'Rajdhani', sans-serif; letter-spacing:0.03em; }
  code, .mono, input, .tag-cell, .path-cell{ font-family:'JetBrains Mono', monospace; }

  /* ---- HERO ---- */
  .hero{
    padding:56px 6vw 40px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(70,255,255,0.04), transparent 70%);
    position:relative;
  }
.lang-switch{ position:absolute; top:14px; right:5vw; z-index:2; }
.lang-select{
       background:var(--panel); border:1px solid var(--line); color:var(--text);
       padding:7px 10px; border-radius:7px; font-size:13px; font-family:'IBM Plex Sans',sans-serif; cursor:pointer;
     }
.lang-select:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em;
    color:var(--cyan); text-transform:uppercase; margin-bottom:14px;
  }
  .eyebrow::before{ content:''; width:18px; height:1px; background:var(--cyan); display:inline-block; }
  .hero h1{
    font-size:clamp(32px, 5vw, 56px); font-weight:700; margin:0 0 10px; color:#fff;
    text-shadow:0 0 30px rgba(70,255,255,0.15);
  }
  .hero h1 span{ color:var(--orange); }
  .hero p.lede{ max-width:640px; color:var(--text-dim); font-size:15.5px; margin:0 0 32px; }

  .simulator{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px 24px;
    max-width:820px;
  }
  .simulator .label{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px; }
  .simulator input[type=text]{
    width:100%; background:#0d1114; border:1px solid var(--line); color:var(--grey);
    padding:12px 40px 12px 14px; border-radius:6px; font-size:14px; outline:none;
  }
  .simulator input[type=text]:focus{ border-color:var(--cyan); }

  /* opacity:1 : Firefox atténue sinon le texte indicatif par défaut */
  .simulator input[type=text]::placeholder{ color:var(--text-dim); font-style:italic; opacity:1; }
  .sim-input-row{ display:flex; align-items:stretch; gap:10px; }
  .sim-field{ position:relative; flex:1; min-width:0; }
  .sim-clear{
    position:absolute; top:50%; right:8px; transform:translateY(-50%);
    width:24px; height:24px; padding:0; display:inline-flex; align-items:center; justify-content:center;
    background:none; border:none; border-radius:5px; color:var(--text-dim);
    font-size:18px; line-height:1; cursor:pointer; transition:color .15s ease;
  }
  .sim-clear:hover{ color:var(--cyan); }
  .sim-field input:placeholder-shown + .sim-clear{ display:none; }
  .preview-frame{
    margin-top:16px; background:#000; border:1px solid var(--line); border-radius:6px;
    padding:16px 18px; min-height:calc(1.5em + 34px); font-family:'JetBrains Mono', monospace; font-size:16px;
    display:flex; align-items:center; flex-wrap:wrap; gap:2px;
  }
  .icon-inline{
    display:inline-flex; align-items:center; justify-content:center;
    margin:0 2px; vertical-align:middle;
  }
  .icon-inline img{ height:18px; width:auto; display:block; }
  .icon-mask{
    display:inline-block; width:18px; height:18px;
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
  }
  .icon-inline.lg img{ height:24px; }
  .icon-inline.lg .icon-mask{ width:24px; height:24px; }
  .sim-hint{ margin-top:10px; font-size:12px; color:var(--text-dim); display:flex; flex-direction:column; gap:4px; }
  .sim-hint code{ color:var(--orange); }

  /* Erreurs de balise : soulignement dans l'aperçu + une petite boîte par erreur sous l'aperçu */
  .sim-error{ text-decoration:underline wavy var(--red); text-underline-offset:4px; }
  .sim-error-msg{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .sim-error-msg[hidden]{ display:none; }
  .sim-error-item{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--grey);
    background:#0d1114; border:1px solid var(--line); border-left:3px solid var(--red);
    border-radius:6px; padding:5px 10px;
  }
  .sim-err-name{ color:var(--red); font-weight:700; }
  .sim-err-fix{ color:var(--teal-green); font-weight:700; }

  .protip{
    max-width:820px; margin-top:18px;
    display:flex; align-items:flex-start; gap:12px;
    background:rgba(255,188,37,0.06); border:1px solid rgba(255,188,37,0.25);
    border-radius:10px; padding:16px 18px;
    font-size:13.5px; color:var(--text-dim); line-height:1.55;
  }
  .protip strong{ color:var(--orange); }
  .protip code{ background:var(--panel-2); padding:1px 6px; border-radius:4px; color:var(--grey); border:1px solid var(--line); font-size:12.5px; }
  .protip-icon{ font-size:18px; flex-shrink:0; line-height:1; margin-top:1px; }

  /* ---- Advanced technique compare block ---- */
  .tint-compare{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    margin:14px 0 18px; max-width:820px;
  }
  .tint-card{
    background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:16px 18px;
  }
  .tint-card .tint-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--cyan); margin-bottom:10px; }
  .tint-card .tint-preview{
    background:#000; border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:10px;
    font-family:'JetBrains Mono', monospace; font-size:15px; display:flex; align-items:center;
  }
  .tint-card code{ font-size:12px; color:var(--text-dim); background:var(--panel-2); padding:4px 8px; border-radius:5px; display:block; word-break:break-all; border:1px solid var(--line); }
  @media (max-width:640px){ .tint-compare{ grid-template-columns:1fr; } }

  .warn-box{
    max-width:820px; margin:16px 0; display:flex; gap:12px; align-items:flex-start;
    background:rgba(255,72,37,0.06); border:1px solid rgba(255,72,37,0.25);
    border-radius:10px; padding:14px 16px; font-size:13.5px; color:var(--text-dim); line-height:1.55;
  }
  .warn-box strong{ color:#ff9080; }

  .important-box{
    max-width:820px; margin:16px 0; display:flex; align-items:flex-start; gap:12px;
    background:rgba(190,155,255,0.08); border:1px solid rgba(190,155,255,0.35);
    border-radius:10px; padding:14px 18px;
    font-size:13.5px; color:var(--text-dim); line-height:1.55;
  }
  .important-box strong{ color:#c9a8ff; }
  .important-box .protip-icon{ color:#c9a8ff; }
  .important-box ul{ margin:8px 0 0; padding-left:20px; font-size:13.5px; }
  .important-box li{ margin-bottom:4px; }

  .sub-arrow{ list-style:none; padding-left:4px; margin:6px 0 0; }
  .sub-arrow li{ position:relative; padding-left:22px; margin-bottom:4px; }
  .sub-arrow li::before{ content:"↳"; position:absolute; left:0; top:0; color:var(--cyan); }

  .info-box{
    max-width:820px; margin:0 0 20px; display:flex; align-items:flex-start; gap:12px;
    background:rgba(70,255,255,0.06); border:1px solid rgba(70,255,255,0.25);
    border-radius:10px; padding:14px 18px;
    font-size:13.5px; color:var(--text-dim); line-height:1.55;
  }
  .info-box strong{ color:var(--cyan); }
  .info-box .protip-icon{ color:var(--cyan); }

  /* ---- Concrete examples ---- */
  .example-list{ display:flex; flex-direction:column; gap:6px; max-width:820px; }
  .example-row{
    display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 16px;
  }
  .example-row-wrap{ display:flex; align-items:center; gap:10px; }
  .example-row-wrap .example-row{ flex:1; min-width:0; }
  .example-preview{ font-family:'JetBrains Mono', monospace; font-size:15px; display:flex; align-items:center; }
  .example-code{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--text-dim); word-break:break-all; }
  @media (max-width:640px){ .example-row{ grid-template-columns:1fr; } }

  /* ---- TABS ---- */
  .tabs{
    position:sticky; top:0; z-index:20;
    display:flex; gap:8px; padding:16px 6vw;
    background:
      linear-gradient(180deg, rgba(70,255,255,0.05), transparent 100%),
      rgba(8,10,13,0.97);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(70,255,255,0.18);
    box-shadow:0 4px 24px rgba(0,0,0,0.35);
  }
  .tab-btn{
    font-family:'Rajdhani', sans-serif; font-weight:600; font-size:15px; letter-spacing:0.04em;
    background:#1a2027; border:1px solid rgba(70,255,255,0.22); color:#aeb8c2;
    padding:9px 18px; border-radius:7px; cursor:pointer; transition:all .15s ease;
  }
  .tab-btn:hover{ color:#fff; border-color:rgba(70,255,255,0.5); background:#212934; }
  .tab-btn.active{ color:#000; background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 16px rgba(70,255,255,0.35); }

  main{ padding:36px 6vw 90px; max-width:1400px; margin:0 auto; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .toolbar{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:22px; }
  .search-box{
    flex:1; min-width:220px; background:var(--panel); border:1px solid var(--line);
    color:var(--text); padding:10px 14px; border-radius:7px; font-size:14px; outline:none;
  }
  .search-box:focus{ border-color:var(--orange); }
  .count-pill{ font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono', monospace; }
  .cat-select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:7px; font-size:13px; font-family:'IBM Plex Sans',sans-serif;
  }

  /* ---- COLOR SPECTRUM STRIP ---- */
  .color-head-wrap{
    display:flex;
    align-items:stretch;
    gap:10px;
    margin-bottom:8px;
  }
  .color-head-spacer{ width:26px; flex-shrink:0; }
  .color-head{
    display:grid;
    grid-template-columns: 210px 260px 90px 130px 1fr;
    gap:14px;
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:6px;
    overflow:hidden;
  }
  .color-head .col{
    padding:8px 14px;
    border-right:1px solid var(--line);
    display:flex;
    align-items:center;
    min-width:0;
  }
  .color-head .col:last-child{ border-right:none; justify-content:flex-end; }
  .color-head .col:last-child .static-label{ text-align:right; }
  .sort-btn{
    background:none; border:none; cursor:pointer; padding:0; width:100%;
    font-family:'IBM Plex Sans', sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--text-dim); text-align:left; transition:color .15s ease;
  }
  .sort-btn:hover{ color:var(--text); }
  .sort-btn.active{ color:var(--cyan); }
  .sort-btn .arrow{ margin-left:3px; font-size:10px; }
  .hex-sort-group{ display:flex; flex-direction:column; gap:4px; }
  .hex-sort-group .sort-btn{ font-size:10px; letter-spacing:0.04em; }
  .color-head .static-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); }
  .color-strip{ display:flex; flex-direction:column; gap:3px; }
  .color-row-wrap{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .color-row{
    display:grid;
    grid-template-columns: 210px 260px 90px 130px 1fr;
    align-items:center;
    gap:14px;
    flex:1;
    min-width:0;
    border-radius:6px;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--line);
    transition:transform .1s ease;
  }
  .color-row:hover{ transform:translateX(2px); border-color:rgba(255,255,255,0.18); }
  .color-tagname{
    padding:0 0 0 14px; font-size:13px; color:var(--grey);
  }
  .color-bar{
    height:40px; width:100%;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%),
      linear-gradient(45deg, rgba(255,255,255,0.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.06) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    background-color:#1a1e23;
    position:relative;
    border-radius:4px;
  }
  .color-bar .fill{ position:absolute; inset:0; border-radius:4px; }
  .color-hex{ font-size:12px; color:var(--text-dim); }
  .color-alpha-pill{
    font-size:10.5px; font-family:'JetBrains Mono', monospace; letter-spacing:0.04em;
    padding:3px 8px; border-radius:20px; white-space:nowrap;
    background:rgba(70,255,255,0.12); color:var(--cyan); border:1px solid rgba(70,255,255,0.3);
  }
  .color-cat{ font-size:11.5px; color:var(--text-dim); padding-right:14px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .copy-btn{
    width:26px; height:26px; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--panel-2); border:1px solid var(--line); border-radius:5px;
    color:var(--text-dim); cursor:pointer; font-size:13px; line-height:1; padding:0;
    transition:all .15s ease;
  }
  .copy-btn:hover{ color:var(--cyan); border-color:rgba(70,255,255,0.4); background:#1c232b; }
  .copy-btn.copied{ color:#031b12; background:var(--teal-green); border-color:var(--teal-green); }

  /* Variante du simulateur : bouton principal, étiré à la hauteur du champ de saisie */
  .sim-input-row .copy-btn{ width:44px; height:auto; font-size:16px; border-radius:6px; }

  @media (max-width:760px){
    .color-row{ grid-template-columns: 140px 1fr 70px; }
    .color-head{ grid-template-columns: 140px 1fr 70px; }
    .color-alpha-pill, .color-cat{ display:none; }
    .color-head .col:nth-child(4), .color-head .col:nth-child(5){ display:none; }
  }

  /* ---- ICONS ---- */
  section.cat-block{ margin-bottom:34px; }
  section.cat-block h3{
    font-size:13px; text-transform:uppercase; letter-spacing:0.14em; color:var(--orange);
    margin:0 0 4px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  section.cat-block .cat-desc{
    font-size:12px; color:var(--text-dim); margin:0 0 10px; font-style:italic;
  }
  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .cat-block th:nth-child(1), .cat-block td:nth-child(1){ width:40px; padding-left:10px; padding-right:4px; }
  .cat-block th:nth-child(2), .cat-block td:nth-child(2){ width:60px; padding-left:4px; padding-right:8px; }
  .cat-block th:nth-child(3), .cat-block td:nth-child(3){ width:158px; padding-left:12px; }
  .cat-block th:nth-child(5), .cat-block td:nth-child(5){ width:130px; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--text-dim); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--line);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  tbody td{ padding:8px 10px; border-bottom:1px solid rgba(35,42,50,0.6); font-size:13.5px; vertical-align:middle; }
  tbody tr:hover{ background:rgba(70,255,255,0.035); }
  .tag-cell{ color:var(--grey); font-size:13px; white-space:nowrap; }
  .path-cell{ color:var(--text-dim); font-size:11.5px; word-break:break-all; }
  .icon-thumb{
    display:inline-flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:6px; background:var(--panel-2);
    border:1px solid var(--line);
  }
  .icon-thumb img{ max-width:24px; max-height:24px; }
  .icon-thumb.empty{ color:var(--text-dim); font-size:11px; }
  .flag{
    display:inline-block; font-size:10px; padding:2px 6px; border-radius:4px;
    letter-spacing:0.05em; text-transform:uppercase; margin-left:6px; vertical-align:middle;
  }
  .flag.dup{ background:rgba(255,188,37,0.14); color:var(--orange); border:1px solid rgba(255,188,37,0.35); }
  .flag.warn{ background:rgba(255,72,37,0.14); color:#ff9080; border:1px solid rgba(255,72,37,0.35); }
  .flag.unk{ background:rgba(139,150,161,0.14); color:var(--text-dim); border:1px solid var(--line); }

  .notes{ max-width:820px; }
  .notes h2{ color:#fff; font-size:22px; margin-top:0; }
  .notes h3{ color:var(--cyan); font-size:15px; text-transform:uppercase; letter-spacing:0.08em; margin:28px 0 8px; }
  .notes p{ color:var(--text-dim); font-size:14.5px; }
  .notes ul{ color:var(--text-dim); font-size:14.5px; padding-left:20px; }
  .notes li{ margin-bottom:6px; }
  .notes code{ background:var(--panel-2); padding:1px 6px; border-radius:4px; color:var(--orange); border:1px solid var(--line); }
  .syn-tag{ color:var(--red); }
  .syn-text{ color:var(--syn-orange); }
  .syn-bracket{ color:var(--yellow); }
  .notes .highlight{ color:var(--teal-green); }
  .source-list{ font-size:13px; }

  footer{ padding:24px 6vw 50px; color:var(--text-dim); font-size:12px; border-top:1px solid var(--line); }
  footer .footer-name{ color:var(--teal-green); font-weight:600; }
  footer .footer-line2{ display:block; margin-top:2px; }
  footer .footer-github{ color:var(--text-dim); text-decoration:none; }
  footer .footer-github:hover{ color:var(--teal-green); text-decoration:underline; }
  footer .footer-copyright{ display:block; margin-top:14px; }

  @media (max-width:640px){
    .hero{ padding:40px 5vw 30px; }
    main{ padding:28px 5vw 70px; }
    .tabs{ padding:12px 5vw; overflow-x:auto; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="lang-switch"><select id="lang-select" class="lang-select" data-i18n-attr="aria-label:lang.label"></select></div>
  <div class="eyebrow" data-i18n="hero.eyebrow"></div>
  <h1 data-i18n="hero.h1"></h1>
  <p class="lede" data-i18n="hero.lede"></p>

  <div class="simulator">
    <label class="label" for="sim-input" data-i18n="hero.label"></label>
    <div class="sim-input-row">
      <div class="sim-field">
        <input type="text" id="sim-input" value="<PET1><IMG>TECH1<> Techs</> <VISOR><IMG>DWAYPOINT<> Elmt/Comp</>" data-i18n-attr="placeholder:hero.sim_input.placeholder">
        <button type="button" class="sim-clear" id="sim-clear" data-i18n-attr="aria-label:hero.sim_clear.aria;title:hero.sim_clear.title">×</button>
      </div>
      <button type="button" class="copy-btn" data-copy-source="sim-input" data-i18n-attr="aria-label:hero.copy.aria;title:hero.copy.title">⧉</button>
    </div>
    <div class="preview-frame" id="sim-preview"></div>
    <div class="sim-error-msg" id="sim-error-msg" aria-live="polite" hidden></div>
    <div class="sim-hint">
      <div data-i18n="hero.hint.div.01"></div>
      <div data-i18n="hero.hint.div.02"></div>
    </div>
  </div>
</header>

<nav class="tabs">
  <button type="button" class="tab-btn active" data-tab="infos" data-i18n="nav.tab.infos"></button>
  <button type="button" class="tab-btn" data-tab="colors" data-i18n="nav.tab.colors"></button>
  <button type="button" class="tab-btn" data-tab="icons" data-i18n="nav.tab.icons"></button>
  <button type="button" class="tab-btn" data-tab="notes" data-i18n="nav.tab.notes"></button>
</nav>

/* ================= UTILS ================= */
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function relLuminance(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 0.299*r + 0.587*g + 0.114*b;
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ================= I18N (langues) =================
   Chaque langue est un bloc <script type="application/json" id="i18n-XX"> placé en fin de fichier :
   un bloc illisible est ignoré (les autres langues continuent de fonctionner).
   - T(clé, params)  : texte au format HTML, nettoyé par liste blanche de balises ; params = HTML de confiance.
   - TA(clé, params) : texte brut (attributs, textContent) ; params = texte brut.
   Clé absente dans la langue active : repli sur DEFAULT_LANG ; I18N.missing liste les clés manquantes. */
const DEFAULT_LANG = 'fr';
const I18N = { dict: {}, meta: {}, order: [], current: null, missing: new Set(), html: new Map(), plain: new Map() };
// Balises et attributs autorisés dans un texte traduit (rien d'autre n'est conservé : pas de script, pas de onclick…)
const I18N_ALLOWED = { A: ['href', 'target', 'rel', 'class'], B: ['class'], BR: [], CODE: ['class'], EM: ['class'], I: ['class'], SPAN: ['class'], STRONG: ['class'] };

function i18nLoad(){
  document.querySelectorAll('script[type="application/json"][id^="i18n-"]').forEach(node => {
    const code = node.id.slice(5);
    try{
      const raw = JSON.parse(node.textContent);
      const d = {};
      Object.keys(raw).forEach(k => { if(k !== '_meta') d[k] = Array.isArray(raw[k]) ? raw[k].join('') : raw[k]; });
      I18N.meta[code] = raw._meta || {};
      I18N.dict[code] = d;
      I18N.order.push(code);
    }catch(e){
      console.error('[i18n] bloc de langue illisible, ignoré :', code, e);
    }
  });
}

function i18nSanitize(html){
  const tpl = document.createElement('template');   // contenu inerte : rien ne s'exécute pendant l'analyse
  tpl.innerHTML = html;
  (function clean(parent){
    Array.from(parent.childNodes).forEach(n => {
      if(n.nodeType === 3) return;
      if(n.nodeType !== 1){ parent.removeChild(n); return; }
      const allowed = I18N_ALLOWED[n.tagName];
      if(!allowed){ parent.replaceChild(document.createTextNode(n.textContent), n); return; }
      Array.from(n.attributes).forEach(a => {
        const ok = allowed.indexOf(a.name) !== -1 &&
          (a.name !== 'href' || /^(https?:\/\/|#)/i.test(a.value)) &&
          (a.name !== 'class' || /^[\w\- ]+$/.test(a.value)) &&
          (a.name !== 'target' || a.value === '_blank') &&
          (a.name !== 'rel' || /^[a-z ]+$/.test(a.value));
        if(!ok) n.removeAttribute(a.name);
      });
      clean(n);
    });
  })(tpl.content);
  return tpl.innerHTML;
}

function i18nRaw(key){
  const cur = I18N.dict[I18N.current], base = I18N.dict[DEFAULT_LANG];
  if(cur && key in cur) return cur[key];
  if(base && key in base){ I18N.missing.add(I18N.current + ':' + key); return base[key]; }
  I18N.missing.add('*:' + key);
  return key;
}
function i18nHas(key){
  const cur = I18N.dict[I18N.current], base = I18N.dict[DEFAULT_LANG];
  return !!((cur && key in cur) || (base && key in base));
}
function i18nHtml(key){
  const ck = I18N.current + '|' + key;
  let v = I18N.html.get(ck);
  if(v === undefined){ v = i18nSanitize(i18nRaw(key)); I18N.html.set(ck, v); }
  return v;
}
function i18nFill(s, params){
  return params ? s.replace(/\{(\w+)\}/g, (m, k) => (k in params ? params[k] : m)) : s;
}
function T(key, params){ return i18nFill(i18nHtml(key), params); }
function TA(key, params){
  const ck = I18N.current + '|' + key;
  let v = I18N.plain.get(ck);
  if(v === undefined){
    const tpl = document.createElement('template');
    tpl.innerHTML = i18nHtml(key);
    v = tpl.content.textContent;
    I18N.plain.set(ck, v);
  }
  return i18nFill(v, params);
}

/* ================= RENDER: COLORS (spectrum strip) ================= */
let colorSort = { key: 'spectrum', dir: 1 };

function sortColorRows(rows, key, dir){
  if(key === 'spectrum'){
    const arr = rows.slice();
    arr.sort((a,b) => {
      let idxA = SPECTRUM_ORDER.indexOf(a[0]);
      let idxB = SPECTRUM_ORDER.indexOf(b[0]);
      if(idxA === -1) idxA = SPECTRUM_ORDER.length;
      if(idxB === -1) idxB = SPECTRUM_ORDER.length;
      return (idxA - idxB) * dir;
    });
    return arr;
  }
  const arr = rows.slice();
  arr.sort((a,b) => {
    const [tagA,hexA] = a, [tagB,hexB] = b;
    let cmp = 0;
    if(key === 'name') cmp = tagA.localeCompare(tagB);
    else if(key === 'hex-alpha') cmp = hexA.localeCompare(hexB);
    else if(key === 'hex-lum') cmp = relLuminance(hexA) - relLuminance(hexB);
    return cmp * dir;
  });
  return arr;
}

/* ================= COPY TO CLIPBOARD ================= */
function copyButtonHtml(copyText){
  const safe = escapeHtml(copyText);
  return `<button type="button" class="copy-btn" data-copy="${safe}" title="${escapeHtml(TA('copy.title', {text: copyText}))}">⧉</button>`;
}

async function copyToClipboard(text, btn){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e2){}
    document.body.removeChild(ta);
  }
  btn.textContent = '✓';
  btn.classList.add('copied');
  clearTimeout(btn._copyTimeout);
  btn._copyTimeout = setTimeout(() => {
    btn.textContent = '⧉';
    btn.classList.remove('copied');
  }, 1400);
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  // data-copy-source : le texte est lu dans le champ au moment du clic, car il
  // change à chaque frappe (simulateur) ; data-copy reste fixe pour les lignes de tableau.
  const text = btn.dataset.copySource ? document.getElementById(btn.dataset.copySource).value : btn.dataset.copy;
  if(!text) return;
  copyToClipboard(text, btn);
});

/* ================= SHARED RENDER ENGINE ================= */
// Recherche stricte d'une balise dans COLOR_MAP / ICON_MAP : le jeu est sensible à la casse,
// donc "red" n'existe pas. Le test sur la casse évite aussi de tomber sur les propriétés
// héritées des objets (ex: "constructor"), que les regex insensibles à la casse laisseraient passer.
function lookupTag(map, name){
  return name === name.toUpperCase() ? map[name] : undefined;
}

// Signale une balise fautive : mémorise l'erreur (sans doublon) dans la liste fournie
// et renvoie le HTML souligné. "fix" = nom correct si seule la casse est en cause.
function flagUnknown(errors, kind, name, html){
  // Icône listée dans le guide mais sans texture (« non fonctionnelle ») : le ? existant suffit, elle n'est pas « inconnue »
  if(kind === 'icon' && ICONS.some(r => r[0] === name)) return html;
  const upper = name.toUpperCase();
  const map = kind === 'color' ? COLOR_MAP : ICON_MAP;
  const fix = kind === 'keyword' ? 'IMG' : (upper !== name && map[upper] ? upper : null);
  if(!errors.some(e => e.kind === kind && e.name === name)) errors.push({kind, name, fix});
  return `<span class="sim-error">${html}</span>`;
}

// Renders NMS tag markup to HTML. Handles: standalone <IMG>NAME<>,
// color-wrapped icon tinting <TAG><IMG>NAME<>...</>, and plain color text <TAG>text</>.
// opts.errors (tableau optionnel) reçoit les balises fautives ; sans lui, rien d'autre ne change.
function renderNMSMarkup(raw, opts){
  opts = opts || {};
  const lg = opts.lg ? ' lg' : '';
  const errors = opts.errors || [];
  // Sécurité : le texte brut est intégralement échappé avant tout traitement.
  // Toute portion qui ne correspond à aucune balise NMS reconnue par les
  // regex ci-dessous reste donc du texte HTML inerte (ex: "&lt;img&gt;")
  // plutôt que d'être injectée telle quelle dans innerHTML — ce qui empêche
  // un texte collé dans le simulateur (ex: "<img src=x onerror=...>") de
  // s'exécuter comme du HTML/JS actif.
  let out = escapeHtml(raw);

  // Step 1: color tag immediately wrapping an icon tag (tint), with optional trailing text
  // Les regex sont insensibles à la casse (flag i) pour pouvoir repérer "red" ou "<img>" ; la validité est vérifiée ensuite.
  out = out.replace(/&lt;([A-Z0-9_]+)&gt;&lt;(IMG)&gt;([A-Z0-9_]+)&lt;&gt;(.*?)&lt;\/&gt;/gi, (m, colorTag, imgWord, iconTag, trailing) => {
    if(imgWord !== 'IMG') return flagUnknown(errors, 'keyword', imgWord, m);
    const c = lookupTag(COLOR_MAP, colorTag);
    const file = lookupTag(ICON_MAP, iconTag);
    let iconHtml;
    if(file && c && !ICON_ALREADY_COLORED.has(file)){
      // monochrome icon → apply the color as a tint via CSS mask
      iconHtml = `<span class="icon-inline${lg}" title="${escapeHtml(TA('icon.tinted_title', {icon: iconTag, color: colorTag}))}"><span class="icon-mask" style="background-color:${hexToRgba(c.hex,c.alpha)};-webkit-mask-image:url('${ICON_DATA[file]}');mask-image:url('${ICON_DATA[file]}')"></span></span>`;
    } else if(file){
      // already-colored icon → keep its native colors, no tint
      iconHtml = `<span class="icon-inline${lg}" title="${iconTag}"><img src="${ICON_DATA[file]}" alt="${iconTag}" decoding="async"></span>`;
    } else {
      iconHtml = flagUnknown(errors, 'icon', iconTag, `<span class="icon-inline${lg}" title="${iconTag}">?</span>`);
    }
    let textHtml = trailing || '';
    if(trailing && trailing.trim().length > 0 && c){
      textHtml = `<span style="color:${hexToRgba(c.hex,c.alpha)}">${trailing}</span>`;
    }
    // couleur inconnue : l'icône n'est pas teintée et le texte reste sans couleur, on le souligne
    if(!c) return flagUnknown(errors, 'color', colorTag, iconHtml + textHtml);
    return iconHtml + textHtml;
  });

  // Step 2: any remaining standalone icons (not wrapped in a color tag)
  out = out.replace(/&lt;(IMG)&gt;([A-Z0-9_]+)&lt;&gt;/gi, (m, imgWord, tag) => {
    if(imgWord !== 'IMG') return flagUnknown(errors, 'keyword', imgWord, m);
    const file = lookupTag(ICON_MAP, tag);
    if(file) return `<span class="icon-inline${lg}" title="${tag}"><img src="${ICON_DATA[file]}" alt="${tag}" decoding="async"></span>`;
    return flagUnknown(errors, 'icon', tag, `<span class="icon-inline${lg}" title="${tag}">?</span>`);
  });

  // Step 3: any remaining plain color-text wraps
  out = out.replace(/&lt;([A-Z0-9_]+)&gt;(.*?)&lt;\/&gt;/gi, (m, tag, inner) => {
    const c = lookupTag(COLOR_MAP, tag);
    if(c) return `<span style="color:${hexToRgba(c.hex,c.alpha)}">${inner}</span>`;
    return flagUnknown(errors, 'color', tag, inner);
  });

  return out;
}

// Construit la petite boîte d'une erreur. Les noms ne contiennent que [A-Za-z0-9_] (cf. regex du moteur).
function simErrorHtml(e){
  const name = `<span class="sim-err-name">${escapeHtml(e.name)}</span>`;
  const fix = e.fix ? `<span class="sim-err-fix">${escapeHtml(e.fix)}</span>` : '';
  let key;
  if(e.kind === 'keyword') key = 'sim.err.keyword';
  else if(e.fix) key = 'sim.err.case_fix';
  else key = e.kind === 'color' ? 'sim.err.unknown_color' : 'sim.err.unknown_icon';
  return `<div class="sim-error-item">${T(key, {name, fix})}</div>`;
}

function renderSimulator(){

  const box = document.getElementById('sim-error-msg');
  box.innerHTML = errors.map(simErrorHtml).join('');
  box.hidden = errors.length === 0;
}

/* ================= CONCRETE EXAMPLES LIST ================= */
function highlightSyntax(raw){
  const tokens = raw.split(/(<IMG>[A-Z0-9_]+<>|<\/>|<[A-Z0-9_]+>)/g).filter(t => t.length > 0);
  return tokens.map(tok => {
    let m;
    if(m = tok.match(/^<IMG>([A-Z0-9_]+)<>$/)){
      return `<span class="syn-bracket">&lt;IMG&gt;</span><span class="syn-tag">${m[1]}</span><span class="syn-bracket">&lt;&gt;</span>`;
    }
    if(tok === '</>'){
      return `<span class="syn-bracket">&lt;/&gt;</span>`;
    }
    if(m = tok.match(/^<([A-Z0-9_]+)>$/)){
      return `<span class="syn-bracket">&lt;</span><span class="syn-tag">${m[1]}</span><span class="syn-bracket">&gt;</span>`;
    }
    if(tok.trim().length === 0) return tok;
    // Défensif : échappement du texte libre pour d'éventuels futurs exemples
    // ajoutés par la communauté (cette fonction n'est aujourd'hui appelée que
    // sur des exemples statiques et fiables, cf. CONTAINER_EXAMPLES).
    return `<span class="syn-text">${escapeHtml(tok)}</span>`;
  }).join('');
}

function renderExampleList(){
  const wrap = document.getElementById('example-list');
  if(!wrap) return;
  let html = '';
  CONTAINER_EXAMPLES.forEach(code => {
    html += `<div class="example-row-wrap">
      <div class="example-row">
        <div class="example-preview">${renderNMSMarkup(code, {lg:true})}</div>
        <div class="example-code">${highlightSyntax(code)}</div>
      </div>
      ${copyButtonHtml(code)}
    </div>`;
  });
  wrap.innerHTML = html;
}

/* ================= TABS ================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ================= EVENT LISTENERS (search / sort / filter / simulator) ================= */
document.getElementById('color-search').addEventListener('input', e => renderColors(e.target.value));
document.querySelectorAll('.color-head .sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.sort;
    if(colorSort.key === key){ colorSort.dir *= -1; }
    else { colorSort.key = key; colorSort.dir = 1; }
    renderColors(document.getElementById('color-search').value);
  });
});
document.getElementById('icon-cat-filter').addEventListener('change', e => renderIcons(document.getElementById('icon-search').value, e.target.value));
document.getElementById('icon-search').addEventListener('input', e => renderIcons(e.target.value, document.getElementById('icon-cat-filter').value));
document.getElementById('sim-input').addEventListener('input', renderSimulator);
document.getElementById('sim-clear').addEventListener('click', () => {
  const input = document.getElementById('sim-input');
  input.value = '';
  renderSimulator();
  input.focus();
});

/* ================= LANGUAGE SELECTOR + INIT ================= */
// Retrouve le code d'une langue disponible à partir d'une valeur brute (ex. "ES", "es-MX") ; null si elle n'existe pas dans le fichier.
function matchLanguage(raw){
  const low = String(raw || '').trim().toLowerCase();
  if(!low) return null;
  return I18N.order.find(c => c.toLowerCase() === low)
      || I18N.order.find(c => c.toLowerCase() === low.split('-')[0])
      || null;
}

// Ordre de choix : langue demandée dans l'adresse (?lang=es), puis choix mémorisé, puis langue du navigateur, sinon DEFAULT_LANG.
// La valeur de l'adresse n'est jamais insérée dans la page : elle est seulement comparée aux langues disponibles.
function detectLanguage(){
  try{
    const requested = matchLanguage(new URLSearchParams(location.search).get('lang'));
    if(requested) return requested;
  }catch(e){}
  let saved = null;
  try{ saved = localStorage.getItem('nmstc-lang'); }catch(e){}
  if(saved && I18N.dict[saved]) return saved;
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
  for(const l of prefs){
    const match = matchLanguage(l);
    if(match) return match;
  }
  return I18N.dict[DEFAULT_LANG] ? DEFAULT_LANG : I18N.order[0];
}

function buildLangSelector(){
  const sel = document.getElementById('lang-select');
  sel.innerHTML = I18N.order.map(c => {
    const m = I18N.meta[c] || {};
    return `<option value="${escapeHtml(c)}">${escapeHtml((m.flag ? m.flag + ' ' : '') + (m.native_name || c))}</option>`;
  }).join('');
  sel.addEventListener('change', () => applyLanguage(sel.value));
}

// Applique une langue : textes statiques (data-i18n), attributs (data-i18n-attr), puis parties générées par le JS.
function applyLanguage(code){
  if(!I18N.dict[code]) code = I18N.dict[DEFAULT_LANG] ? DEFAULT_LANG : I18N.order[0];
  I18N.current = code;
  document.documentElement.lang = code;
  document.title = TA('page.title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-attr]').forEach(el => {
    el.dataset.i18nAttr.split(';').forEach(pair => {
      const i = pair.indexOf(':');
      el.setAttribute(pair.slice(0, i), TA(pair.slice(i + 1)));
    });
  });
  fillCatFilter();
  renderColors(document.getElementById('color-search').value);
  renderIcons(document.getElementById('icon-search').value, document.getElementById('icon-cat-filter').value);
  renderSimulator();
  renderTintExamples();
  renderExampleList();
  document.getElementById('lang-select').value = code;
  try{ localStorage.setItem('nmstc-lang', code); }catch(e){}
  // Adresse synchronisée : ?lang=xx dans la barre d'adresse, pour pouvoir copier un lien dans la langue affichée (sans nouvelle entrée d'historique).
  try{
    const url = new URL(location.href);
    url.searchParams.set('lang', code);
    history.replaceState(null, '', url);
  }catch(e){}
}

/* ================= INIT ================= */
function initPage(){
  i18nLoad();
  buildLangSelector();
  applyLanguage(detectLanguage());
}
// Les blocs de langues sont placés après ce script : l'initialisation attend la fin du chargement de la page.
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPage);
else initPage();

</script>
